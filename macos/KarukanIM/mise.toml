[tasks.install]
run = '''
killall KarukanIM || true
sleep 1

xcodebuild -scheme KarukanIM -configuration Release build
sleep 5

# NOTE: `open -a` は使わない。Input Method アプリは LSUIElement であり、
# LaunchServices 経由の起動が RBSRequestErrorDomain Code=5 で失敗するため。
open ~/Library/Input\ Methods/KarukanIM.app || true
'''

[tasks.bump]
description = "マーケティングバージョンを更新 (例: mise run bump 1.2.0)"
run = "agvtool new-marketing-version {{arg(name='version')}}"

[tasks.clean]
run = '''
xcodebuild -scheme KarukanIM clean
'''
